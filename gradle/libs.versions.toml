# Каталог версий «Склянки».
#
# Единственное место, где перечислены координаты зависимостей. Это не мода:
# утверждение «артефактов Google Play Services в проекте нет» (ПЛ-4, НФТ-39)
# проверяется чтением этого файла плюс отчётом о фактических зависимостях сборки.

[versions]
agp = "8.7.3"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.28"
hilt = "2.52"
room = "2.6.1"
datastore = "1.1.1"
detekt = "1.23.7"
ktlint-plugin = "12.1.2"
coreKtx = "1.13.1"
coreSplashscreen = "1.0.1"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.10.01"
# Виджеты домашнего экрана (SKL-118, Р-34): Glance — та же разметка Compose, но для
# поверхности, которая живёт вне процесса приложения. Одна версия на оба артефакта:
# библиотека отрисовки разметки в JVM-тестах идёт в ногу с самой Glance.
glance = "1.1.1"
coroutines = "1.9.0"
# Формат файла переноса данных (SKL-19): один файл JSON, разбираемый строго
# по обязательным полям и терпимо к незнакомым ключам.
kotlinxSerialization = "1.7.3"
# Фоновая работа (SKL-13, ОВ-79): перепланирование будильников обязано переживать смерть
# процесса, поэтому оно идёт задачей WorkManager, а не работой приёмника.
# Артефакт -ktx с версии 2.7 — заглушка: CoroutineWorker и Operation.await() лежат
# в самом work-runtime.
work = "2.9.1"
turbine = "1.2.0"
junit5 = "5.11.3"
junit4 = "4.13.2"
androidxTestJunit = "1.2.1"
androidxTestCore = "1.6.1"
androidxTestRunner = "1.6.2"
cucumber = "7.20.1"
# Стенд экранных проверок на JVM (SKL-24): имитация Android для Compose-тестов.
# Версия задаёт заодно координату android-all-instrumented ниже: Robolectric принимает
# только тот снимок платформы, который знает сам, и подставлять его руками нельзя.
robolectric = "4.17"
# Снимок платформы API 35 для Robolectric 4.17: androidVersion 15, сборка 13954326,
# предварительная инструментация версии 7. Объявлен зависимостью, а не скачиванием
# из самого Robolectric: иначе версия платформы живёт вне каталога версий, и обещание
# «версии одним местом» перестаёт быть правдой.
robolectricAndroidAll = "15-robolectric-13954326-i7"
# Снятие и сверка эталонных снимков поверх Robolectric (SKL-24).
#
# 1.60.0, а не последняя: начиная с 1.61.0 библиотека собирается Kotlin 2.3, и её
# метаданные (mv=2.3.0) компилятор проекта (Kotlin 2.0.21, читает до 2.1.0) не понимает.
# Поднимать Kotlin ради снимочного стенда — решение уровня проекта, а не этой задачи.
roborazzi = "1.60.0"
junitPlatform = "1.11.3"
kotlinpoet = "1.18.1"
# Huawei-аналитика и A/B были убраны из релиза (ПМ-31), а контур вырезан из сборки (Р-4,
# SKL-106). Репозиторий вендора и конфигурация agconnect сохранены для биллингового
# контура «Склянки Про» (Р-37, Р-38, SKL-122): его координаты вносятся в каталог вместе
# с задачей биллинга.
#
# Клиент магазина AppGallery (SKL-122). Вендорская координата платёжного контура;
# её замыкание (base → ui, stats, device, log, baselegacyapi, availableupdate; hmf:tasks)
# внесено в белый список состава артефакта осознанно (`NetworkContourCatalog`).
# Названные следствия: `com.huawei.hms:stats` — телеметрия вендорского клиента (Р-4);
# замыкание объявляет `ACCESS_NETWORK_STATE`, и оно снимается манифестом app
# (`tools:node="remove"`) — запрет НФТ-15 не ослабляется.
huaweiIap = "6.16.6.305"

[libraries]
# --- Домен: чистый Kotlin, без Android ---
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
junit5-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit5" }
junit5-params = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junit5" }
junit5-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit5" }

# --- Android ---
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
# Штатный экран запуска Android 12+ с бэкпортом на minSdk 26 (SKL-21).
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "coreSplashscreen" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
# Состояние экрана переживает поворот и уход в фон: viewModelScope нужен feature-* (SKL-09).
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }

# --- Compose ---
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

# --- Виджеты домашнего экрана (SKL-118, Р-34) ---
#
# Glance — единственная библиотека, которой рисуется виджет: та же разметка Compose, но
# для поверхности вне процесса приложения. Тестовый артефакт отрисовывает разметку
# в JVM-тесте под Robolectric: кадр виджета снимается без устройства (TDD §10.3).
glance-appwidget = { module = "androidx.glance:glance-appwidget", version.ref = "glance" }
glance-appwidget-testing = { module = "androidx.glance:glance-appwidget-testing", version.ref = "glance" }

# --- Hilt ---
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
# Hilt-стенд устройства (SKL-97): приложение тестов, компонент на проверку и подмены
# `@TestInstallIn`. Артефакт Dagger, не GMS (ПЛ-4); живёт только в androidTest-конфигурациях.
hilt-android-testing = { module = "com.google.dagger:hilt-android-testing", version.ref = "hilt" }

# --- Room ---
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-testing = { module = "androidx.room:room-testing", version.ref = "room" }

# --- Постоянные настройки: активный профиль переживает перезапуск (ПРФ-17, ПРФ-18) ---
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

# --- Платный контур «Склянки Про» (SKL-122) ---
#
# Клиент AppGallery IAP. Подключается только модулем контура `billing-appgallery`:
# зависимость от вендора закрыта портом `ProStore`, и ядро о ней не знает (ADR-0010 п. 2).
# Репозитория двери открыты только для групп `com.huawei.*` (settings.gradle.kts).
huawei-iap = { module = "com.huawei.hms:iap", version.ref = "huaweiIap" }

# --- Фоновая работа: задача перепланирования будильников (SKL-13, НАП-13) ---
#
# Библиотека объявляет в своём манифесте ACCESS_NETWORK_STATE, FOREGROUND_SERVICE и WAKE_LOCK.
# Первое снимается в манифесте app через tools:node="remove": продукт обещает «сеть
# не требуется» (ПЛ-3, НФТ-15), сетевых ограничений у задач нет, и проверка состава
# собранного артефакта это подтверждает.
androidx-work-runtime = { module = "androidx.work:work-runtime", version.ref = "work" }

# --- Инструментальные тесты ---
junit4 = { module = "junit:junit", version.ref = "junit4" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
androidx-test-core = { module = "androidx.test:core-ktx", version.ref = "androidxTestCore" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }

# --- Экранный и снимочный стенд на JVM (SKL-24) ---
#
# Robolectric даёт Compose-тестам настоящий Context, настоящие ресурсы и настоящую
# композицию в обычной задаче test. Roborazzi поверх него снимает и сверяет снимки.
# Ни одна из этих зависимостей не приходит в продуктовый classpath: они объявляются
# только в тестовых конфигурациях, и проверка состава артефакта это подтверждает.
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
robolectric-android-all = { module = "org.robolectric:android-all-instrumented", version.ref = "robolectricAndroidAll" }
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }

# --- Сценарный прогон ---
cucumber-java = { module = "io.cucumber:cucumber-java", version.ref = "cucumber" }
cucumber-core = { module = "io.cucumber:cucumber-core", version.ref = "cucumber" }
cucumber-junit-platform-engine = { module = "io.cucumber:cucumber-junit-platform-engine", version.ref = "cucumber" }
# Фабрика объектов Cucumber: один экземпляр состояния сценария на все классы шагов (SKL-23).
cucumber-picocontainer = { module = "io.cucumber:cucumber-picocontainer", version.ref = "cucumber" }
junit-platform-suite = { module = "org.junit.platform:junit-platform-suite", version.ref = "junitPlatform" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junitPlatform" }

# --- Сборочная логика (для build-logic и модуля правил detekt) ---
build-gradle-plugin-android = { module = "com.android.tools.build:gradle", version.ref = "agp" }
build-gradle-plugin-kotlin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
build-gradle-plugin-ksp = { module = "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }
build-gradle-plugin-detekt = { module = "io.gitlab.arturbosch.detekt:detekt-gradle-plugin", version.ref = "detekt" }
build-gradle-plugin-ktlint = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlint-plugin" }
detekt-api = { module = "io.gitlab.arturbosch.detekt:detekt-api", version.ref = "detekt" }
detekt-test = { module = "io.gitlab.arturbosch.detekt:detekt-test", version.ref = "detekt" }

[bundles]
# Обвязка модульных тестов домена: JUnit 5 + управление виртуальным временем + Turbine.
domain-test = ["junit5-api", "junit5-params", "kotlinx-coroutines-test", "turbine"]
# Базовый набор Compose для core-ui, feature-* и app.
compose = [
    "androidx-compose-ui",
    "androidx-compose-ui-graphics",
    "androidx-compose-ui-tooling-preview",
    "androidx-compose-material3",
]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-plugin" }
