# Конфигурация detekt «Склянки».
#
# Роль detekt — содержание кода, а не оформление: отступы и импорты проверяет ktlint
# (TDD §5.1). Любая находка валит сборку — режим предупреждений не используется (TDD §5.2).
# Файл дополняет стандартную конфигурацию (buildUponDefaultConfig = true).

build:
  maxIssues: 0
  excludeCorrectable: false

config:
  validation: true
  warningsAsErrors: false
  # Собственный набор правил проекта нужно объявить, иначе валидация конфигурации
  # сочтёт секцию sklyanka опечаткой.
  checkExhaustiveness: false

processors:
  active: true

console-reports:
  active: true

# --- Собственные правила проекта (TDD §5.3) ---
sklyanka:
  active: true

  HardcodedDesignToken:
    active: true
    # Единственное место, где литералы цвета и размера законны, — токены дизайн-системы.
    allowedPackages: 'ru.stohastika.sklyanka.ui.token'
    allowedFiles: ''

  HardcodedTextStyle:
    active: true
    # Шкала типографики — единственное место, где TextStyle собирается из значений.
    allowedPackages: 'ru.stohastika.sklyanka.ui.token'
    allowedFiles: ''

  RussianTextInCode:
    active: true
    # Шаги приёмки обязаны дословно совпадать с русским Gherkin из docs/tasks:
    # это ключевые слова сценария, а не текст интерфейса.
    allowedPackages: 'ru.stohastika.sklyanka.acceptance'
    allowedFiles: ''

  DirectSystemClockAccess:
    active: true
    # Реализация источника времени — единственное место, где часы читаются напрямую (НФТ-48).
    # Разрешение по пакету, а не по имени файла: иначе любой файл SystemTimeSource.kt
    # в любом модуле обходил бы правило (ОВ-73).
    allowedPackages: 'ru.stohastika.sklyanka.platform.time'
    allowedFiles: ''

  DestructiveRoomMigration:
    active: true

  AndroidImportInDomain:
    active: true
    domainPackages: 'ru.stohastika.sklyanka.domain'

  MedicalDataInJournal:
    active: true
    # Вызовы журналирования: журнал операций (SKL-07) и журнал срабатываний (SKL-13).
    journalCalls: 'record,ReminderLogEntry,OpLogRecord'

# --- Стандартные правила: точечные послабления ---
complexity:
  LongParameterList:
    functionThreshold: 7
    constructorThreshold: 8
  TooManyFunctions:
    active: true
    thresholdInFiles: 20
    thresholdInClasses: 20
    thresholdInInterfaces: 20
    thresholdInObjects: 20

style:
  MagicNumber:
    active: true
    # Пакет дизайн-системы — единственное место, где числовые литералы цвета
    # и размера законны: это и есть определение токенов (НФТ-47).
    # Тестовые наборы возвращены в список явно: задавая excludes, мы затираем
    # штатные исключения detekt, и тогда каждая дата и каждое ожидаемое число
    # в тесте требует именованной константы — проверка дорожает, не становясь строже.
    excludes: ['**/ui/token/**', '**/test/**', '**/androidTest/**']
    ignoreNumbers: ['-1', '0', '1', '2']
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotation: true
    ignoreNamedArgument: true
  MaxLineLength:
    active: true
    maxLineLength: 120
  ForbiddenComment:
    active: false
  UnusedPrivateMember:
    active: true

naming:
  FunctionNaming:
    active: true
    # Compose-функции именуются с большой буквы — это соглашение Compose, а не нарушение.
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    active: true

comments:
  active: true
  UndocumentedPublicClass:
    active: false
  UndocumentedPublicFunction:
    active: false
