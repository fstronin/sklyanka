AutoName: Склянка
Description: |
  A medication tracker for Android. A person sets up a course: schedule, dose,
  relation to meals, course period and package stock. The app reminds at the
  scheduled minute, takes a one-tap mark and keeps a history that can be shown
  to a doctor as a PDF report.

  Reminders survive a reboot, Doze, a time-zone change and the battery
  optimisation of the firmware, and a delivery self-check tests the real path.
  History and adherence come by day, week and month; a calendar, a PDF report
  for the doctor and CSV export are included. Up to five profiles keep a
  caregiver's own medications apart from a dependant's. Three home-screen
  widgets, six interface languages, and moving to another device with a single
  file the person creates and keeps.

  The product is free in full: no paid tier, no subscription, no purchases. No
  account, no cloud, no sync, no ads and no analytics: the shipped build
  declares no network permission and the health data stays on the device. The
  app is not a medical device: it gives no treatment recommendations, selects
  no dosages and checks no drug interactions.

  The interface is Russian, with English, Spanish, German, Chinese and Kazakh
  translations.

