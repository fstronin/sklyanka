<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Знак — донце склянки</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;font-family:'Golos Text',system-ui,sans-serif;background:#FBF7F1;-webkit-font-smoothing:antialiased}
a{color:#B4512F;text-decoration:none}a:hover{color:#8F3E23}
</style>
</helmet>
<div style="width: 460px; height: 460px; box-sizing: border-box; background: #191512; display: flex; align-items: center; justify-content: center">
<svg width="312" height="312" viewBox="0 0 200 200" fill="none" role="img" aria-label="Знак Склянка: донце толстого стекла">
<defs>
<radialGradient id="glassBody" cx="34%" cy="28%" r="78%">
<stop offset="0%" stop-color="#FBF7F1" stop-opacity="0.24"></stop>
<stop offset="52%" stop-color="#FBF7F1" stop-opacity="0.07"></stop>
<stop offset="100%" stop-color="#FBF7F1" stop-opacity="0.015"></stop>
</radialGradient>
<radialGradient id="caustic" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="{{accent}}" stop-opacity="0.62"></stop>
<stop offset="100%" stop-color="{{accent}}" stop-opacity="0"></stop>
</radialGradient>
<linearGradient id="rimLight" x1="18%" y1="8%" x2="86%" y2="94%">
<stop offset="0%" stop-color="#FBF7F1" stop-opacity="0.85"></stop>
<stop offset="46%" stop-color="#FBF7F1" stop-opacity="0.16"></stop>
<stop offset="100%" stop-color="#FBF7F1" stop-opacity="0.42"></stop>
</linearGradient>
</defs>

<ellipse cx="100" cy="163" rx="58" ry="19" fill="url(#caustic)"></ellipse>

<circle cx="100" cy="100" r="86" fill="url(#glassBody)"></circle>
<circle cx="100" cy="100" r="86" stroke="url(#rimLight)" stroke-width="3.5"></circle>

<circle cx="100" cy="100" r="66" stroke="#FBF7F1" stroke-opacity="0.13" stroke-width="7"></circle>
<circle cx="100" cy="100" r="47" stroke="#FBF7F1" stroke-opacity="0.26" stroke-width="2"></circle>
<circle cx="100" cy="100" r="28" stroke="#FBF7F1" stroke-opacity="0.5" stroke-width="2.5"></circle>

<path d="M25.1 86.8A76 76 0 0 1 86.8 25.1L88.4 34A67 67 0 0 0 34 88.4Z" fill="#FBF7F1" fill-opacity="0.82"></path>
<path d="M44.6 131.4A62 62 0 0 0 63 149.9" stroke="#FBF7F1" stroke-opacity="0.3" stroke-width="3" stroke-linecap="round"></path>

<path d="M180.8 129.4A86 86 0 0 1 114.9 184.7" stroke="{{accent}}" stroke-width="4.5" stroke-linecap="round"></path>

<circle cx="100" cy="100" r="8" fill="#FBF7F1" fill-opacity="0.92"></circle>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C9633D","options":["#C9633D","#2E8296","#C79A3B","#8E6BA8"]},"$preview":{"width":460,"height":460}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#C9633D' };
  }
}
</script>
</body>
</html>
