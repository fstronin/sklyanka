<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Иконка — тёмная и светлая</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;font-family:'Golos Text',system-ui,sans-serif;background:#FBF7F1;-webkit-font-smoothing:antialiased}
a{color:#B4512F;text-decoration:none}a:hover{color:#8F3E23}
</style>
</helmet>
<div style="width: 460px; height: 460px; box-sizing: border-box; background: #FBF7F1; display: flex; align-items: center; justify-content: center; gap: 32px">

<div style="width: 180px; height: 180px; border-radius: 48px; background: #111A1E; display: flex; align-items: center; justify-content: center; overflow: hidden">
<svg width="150" height="150" viewBox="0 0 200 200" fill="none" role="img" aria-label="Иконка на тёмном фоне">
<defs>
<radialGradient id="gbD" cx="34%" cy="28%" r="78%">
<stop offset="0%" stop-color="#C4F0F7" stop-opacity="0.24"></stop>
<stop offset="52%" stop-color="#C4F0F7" stop-opacity="0.07"></stop>
<stop offset="100%" stop-color="#C4F0F7" stop-opacity="0.015"></stop>
</radialGradient>
<radialGradient id="caD" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="{{accent}}" stop-opacity="0.62"></stop>
<stop offset="100%" stop-color="{{accent}}" stop-opacity="0"></stop>
</radialGradient>
<linearGradient id="rlD" x1="18%" y1="8%" x2="86%" y2="94%">
<stop offset="0%" stop-color="#C4F0F7" stop-opacity="0.85"></stop>
<stop offset="46%" stop-color="#C4F0F7" stop-opacity="0.16"></stop>
<stop offset="100%" stop-color="#C4F0F7" stop-opacity="0.42"></stop>
</linearGradient>
</defs>
<ellipse cx="100" cy="163" rx="58" ry="19" fill="url(#caD)"></ellipse>
<circle cx="100" cy="100" r="86" fill="url(#gbD)"></circle>
<circle cx="100" cy="100" r="86" stroke="url(#rlD)" stroke-width="3.5"></circle>
<circle cx="100" cy="100" r="66" stroke="#C4F0F7" stroke-opacity="0.13" stroke-width="7"></circle>
<circle cx="100" cy="100" r="47" stroke="#C4F0F7" stroke-opacity="0.26" stroke-width="2"></circle>
<circle cx="100" cy="100" r="28" stroke="#C4F0F7" stroke-opacity="0.5" stroke-width="2.5"></circle>
<path d="M25.1 86.8A76 76 0 0 1 86.8 25.1L88.4 34A67 67 0 0 0 34 88.4Z" fill="#C4F0F7" fill-opacity="0.82"></path>
<path d="M180.8 129.4A86 86 0 0 1 114.9 184.7" stroke="{{accent}}" stroke-width="4.5" stroke-linecap="round"></path>
<circle cx="100" cy="100" r="8" fill="#C4F0F7" fill-opacity="0.92"></circle>
</svg>
</div>

<div style="width: 180px; height: 180px; border-radius: 48px; background: #E7F0F4; display: flex; align-items: center; justify-content: center; overflow: hidden">
<svg width="150" height="150" viewBox="0 0 200 200" fill="none" role="img" aria-label="Иконка на светлом фоне">
<defs>
<radialGradient id="gbL" cx="34%" cy="28%" r="78%">
<stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"></stop>
<stop offset="58%" stop-color="#FFFFFF" stop-opacity="0.35"></stop>
<stop offset="100%" stop-color="#0B2831" stop-opacity="0.06"></stop>
</radialGradient>
<radialGradient id="caL" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="{{accent}}" stop-opacity="0.55"></stop>
<stop offset="100%" stop-color="{{accent}}" stop-opacity="0"></stop>
</radialGradient>
<linearGradient id="rlL" x1="18%" y1="8%" x2="86%" y2="94%">
<stop offset="0%" stop-color="#0B2831" stop-opacity="0.16"></stop>
<stop offset="46%" stop-color="#0B2831" stop-opacity="0.5"></stop>
<stop offset="100%" stop-color="#0B2831" stop-opacity="0.22"></stop>
</linearGradient>
</defs>
<ellipse cx="100" cy="163" rx="58" ry="19" fill="url(#caL)"></ellipse>
<circle cx="100" cy="100" r="86" fill="url(#gbL)"></circle>
<circle cx="100" cy="100" r="86" stroke="url(#rlL)" stroke-width="3.5"></circle>
<circle cx="100" cy="100" r="66" stroke="#0B2831" stroke-opacity="0.09" stroke-width="7"></circle>
<circle cx="100" cy="100" r="47" stroke="#0B2831" stroke-opacity="0.2" stroke-width="2"></circle>
<circle cx="100" cy="100" r="28" stroke="#0B2831" stroke-opacity="0.42" stroke-width="2.5"></circle>
<path d="M25.1 86.8A76 76 0 0 1 86.8 25.1L88.4 34A67 67 0 0 0 34 88.4Z" fill="#FFFFFF" fill-opacity="0.95"></path>
<path d="M180.8 129.4A86 86 0 0 1 114.9 184.7" stroke="{{accent}}" stroke-width="4.5" stroke-linecap="round"></path>
<circle cx="100" cy="100" r="8" fill="#0B2831" fill-opacity="0.72"></circle>
</svg>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#A86A22","options":["#A86A22","#2E8296","#C79A3B","#8E6BA8"]},"$preview":{"width":460,"height":460}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#A86A22' };
  }
}
</script>
</body>
</html>
