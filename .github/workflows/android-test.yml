# Optional gate: instrumented tests on an emulator run only when started explicitly
# (workflow_dispatch) and do not block push/pull_request. The mandatory contour lives in
# verify.yml, where androidTest sources are at least compiled (the variant tasks
# assembleFreeDebugAndroidTest/assembleProDebugAndroidTest are part of verifyAll).
#
# The emulator image is AOSP without Google APIs (target: default): the product lives without
# GMS, and the local harness in tools/emulator/ uses the same images. The API levels of the
# local matrix are 26, 31 and 35; the default here is 35, the compileSdk level.
#
# KVM is enabled by hand: without hardware virtualisation an x86_64 emulator on ubuntu-latest
# either does not start or starts unacceptably slowly.
name: android-test

on:
  workflow_dispatch:
    inputs:
      api-level:
        description: 'Emulator API level (26, 31 or 35)'
        required: false
        default: '35'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  connected-tests:
    name: connectedFreeDebugAndroidTest (API ${{ inputs.api-level || '35' }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api-level || '35' }}
          target: default
          arch: x86_64
          disable-animations: true
          # The app module has a product variant dimension, so it has no unflavored
          # connectedDebugAndroidTest task; the shipped variant is `free`.
          script: ./gradlew :app:connectedFreeDebugAndroidTest :core-data:connectedDebugAndroidTest :feature-history:connectedDebugAndroidTest --no-daemon --stacktrace
