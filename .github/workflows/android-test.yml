# Необязательный гейт (Р-19): инструментальные тесты на эмуляторе запускаются
# только явно (workflow_dispatch) и не блокируют push/pull_request — обязательный
# контур живёт в verify.yml, где androidTest-исходники хотя бы компилируются
# (assembleDebugAndroidTest входит в verifyAll).
#
# Образ эмулятора — AOSP без Google APIs (target: default): продукт живёт без
# GMS (ПЛ-4, НФТ-39), и локальная оснастка tools/emulator/ использует те же
# образы. Уровни API локальной матрицы — 26, 31, 35 (tools/emulator/config.sh);
# по умолчанию здесь 35 — уровень compileSdk.
#
# KVM включается вручную: без аппаратной виртуализации x86_64-эмулятор на
# ubuntu-latest либо не стартует, либо стартует неприемлемо долго.
name: android-test

on:
  workflow_dispatch:
    inputs:
      api-level:
        description: 'Уровень API эмулятора (26, 31 или 35)'
        required: false
        default: '35'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  connected-tests:
    name: connectedDebugAndroidTest (API ${{ inputs.api-level || '35' }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api-level || '35' }}
          target: default
          arch: x86_64
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace
