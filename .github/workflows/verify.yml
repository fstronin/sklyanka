# The mandatory gate: one verification run on every push and pull_request to main.
#
# The `verifyAll` task is assembled in `build-logic/convention` (ProjectChecksConventionPlugin):
# the build of every module, static analysis, the artifact composition checks, all JVM test
# levels and the acceptance scenarios. Instrumented tests are only compiled here
# (assembleFreeDebugAndroidTest); running them on an emulator is a
# separate optional workflow, android-test.yml, started explicitly.
name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One run per branch: a new push cancels the outdated run instead of queueing next to it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-all:
    name: verifyAll
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # JDK 17 is the JVM target of the whole project (ProjectDefaults.JVM_TARGET).
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Run verifyAll
        run: ./gradlew verifyAll --no-daemon --stacktrace
