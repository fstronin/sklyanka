# Обязательный гейт (Р-19, docs/v2/04-roadmap.md): единый проверочный прогон
# на каждый push и pull_request в main. Задача verifyAll собирается в
# build-logic/convention (ProjectChecksConventionPlugin): сборка всех модулей,
# статический анализ, проверки состава артефактов, все уровни тестов JVM и
# приёмочные сценарии. Инструментальные тесты здесь только компилируются
# (assembleDebugAndroidTest); их запуск на эмуляторе — отдельный необязательный
# workflow android-test.yml по явному запуску.
name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Один прогон на ветку: новый push отменяет устаревший, а не встаёт в очередь рядом.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-all:
    name: verifyAll
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # JDK 17 — целевая версия JVM всего проекта (ProjectDefaults.JVM_TARGET).
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Run verifyAll
        run: ./gradlew verifyAll --no-daemon --stacktrace
